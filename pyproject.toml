[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darwinbox-data-qa"
version = "0.1.0"
description = "AI-powered Q&A over uploaded CSV and Excel files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "langchain-core>=0.3,<2",
  "langchain-groq>=0.2,<2",
  "langgraph>=0.2,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlglot>=26,<29",
  "uvicorn[standard]>=0.32,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
