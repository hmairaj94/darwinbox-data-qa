<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DataLens Q&A</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">AI DATA ANALYST</span><h1>Ask your files.</h1><p>Upload CSV or Excel files, then explore them in plain English.</p></header>
    <section class="card" id="upload-card">
      <h2>1. Add data</h2>
      <form id="upload-form"><input id="files" type="file" accept=".csv,.xlsx,.xls" multiple required><button>Upload files</button></form>
      <div id="dataset" class="muted"></div>
    </section>
    <section class="card disabled" id="query-card">
      <h2>2. Ask a question</h2>
      <form id="query-form"><input id="question" placeholder="e.g. Compare monthly revenue by region" required><button>Ask</button></form>
      <div id="status" class="muted"></div>
      <article id="answer" hidden><h3>Answer</h3><p id="answer-text"></p><details><summary>SQL used</summary><pre id="sql"></pre></details></article>
      <div class="chart-wrap" hidden><canvas id="chart"></canvas></div>
      <div class="table-wrap"><table id="result-table"></table></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
